name: Build

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    branches:
        - '**'
  push:
    branches:
        - '**'

permissions: write-all

jobs:
  cross-build:
    name: 'Cross build'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        target: [
          # Linux (glibc)
          'x86_64-unknown-linux-gnu2.17',
          'i386-unknown-linux-gnu2.19',
          'arm-unknown-linux-gnueabihf2.13',
          'aarch64-unknown-linux-gnu2.19',
          
          # Linux (musl)
          'aarch64-unknown-linux-musl',
          'x86_64-unknown-linux-musl',
          'armv6-unknown-linux-musleabihf',
          'armv7-unknown-linux-musleabihf',
          'i386-unknown-linux-musl',
          
          # FreeBSD
          'x86_64-unknown-freebsd',
          'aarch64-unknown-freebsd',
          'i386-unknown-freebsd',

          # Android (API level 21)
          'aarch64-unknown-linux-android21',
          'armv7-unknown-linux-androideabi21',
          'i686-unknown-linux-android21',
          'x86_64-unknown-linux-android21',
        ]
    steps:
    - uses: actions/checkout@main
      with:
        submodules: true
    - name: Cross-compile GDB to ${{ matrix.target }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ '${{ matrix.target }}' = *'-android'* ]]; then
            declare archive='/tmp/android-gcc-cross.tar.xz'
            declare artifact_name='x86_64-unknown-linux-gnu'
            declare repository='AmanoTeam/android-gcc-cross'

            curl \
                --connect-timeout '10' \
                --retry '15' \
                --retry-all-errors \
                --fail \
                --silent \
                --show-error \
                --location \
                --url "https://github.com/${repository}/releases/latest/download/${artifact_name}.tar.xz" \
                --output "${archive}"

            # The latest release can contain an empty archive when its most recent
            # toolchain build failed. In that case, use the newest usable CI artifact.
            if [ "$(stat --format='%s' "${archive}")" -le '1048576' ]; then
                rm --force "${archive}"

                for run_id in $(gh run list \
                    --repo "${repository}" \
                    --workflow 'build.yml' \
                    --status 'success' \
                    --limit '30' \
                    --json 'databaseId' \
                    --jq '.[].databaseId'); do
                    declare artifact_id

                    artifact_id="$(gh api \
                        "repos/${repository}/actions/runs/${run_id}/artifacts?per_page=100" \
                        --jq ".artifacts[] | select(.name == \"${artifact_name}\" and .size_in_bytes > 1048576 and (.expired | not)) | .id" \
                        | head --lines='1')"

                    [ -n "${artifact_id}" ] || continue

                    gh run download "${run_id}" \
                        --repo "${repository}" \
                        --name "${artifact_name}" \
                        --dir '/tmp/android-gcc-cross-artifact'

                    archive="/tmp/android-gcc-cross-artifact/${artifact_name}.tar.xz"
                    break
                done
            fi

            if ! [ -f "${archive}" ]; then
                echo 'Unable to find a usable android-gcc-cross toolchain archive.' >&2
                exit '1'
            fi

            tar --directory='/tmp' --extract --file="${archive}"

            export PINO_HOME='/tmp/android-gcc-cross'
            export PATH="${PINO_HOME}/bin:${PATH}"

            source "${PINO_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-linux-musl'* ]]; then
            declare -r RAIDEN_TAG="$(jq --raw-output '.tag_name' <<< "$(curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --url 'https://api.github.com/repos/AmanoTeam/musl-gcc-cross/releases/latest')")"
            declare -r RAIDEN_TARBALL='/tmp/toolchain.tar.xz'
            declare -r RAIDEN_URL="https://github.com/AmanoTeam/musl-gcc-cross/releases/download/${RAIDEN_TAG}/x86_64-unknown-linux-gnu.tar.xz"
            
            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${RAIDEN_URL}" --output "${RAIDEN_TARBALL}"
            tar --directory="$(dirname "${RAIDEN_TARBALL}")" --extract --file="${RAIDEN_TARBALL}"
            
            export RAIDEN_HOME='/tmp/musl-gcc-cross'
            export PATH="${RAIDEN_HOME}/bin:${PATH}"
            
            source "${RAIDEN_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-linux-gnu'* ]]; then
            declare -r OBGGCC_TAG="$(jq --raw-output '.tag_name' <<< "$(curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --url 'https://api.github.com/repos/AmanoTeam/obggcc/releases/latest')")"
            declare -r OBGGCC_TARBALL='/tmp/toolchain.tar.xz'
            declare -r OBGGCC_URL="https://github.com/AmanoTeam/obggcc/releases/download/${OBGGCC_TAG}/x86_64-unknown-linux-gnu.tar.xz"
            
            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${OBGGCC_URL}" --output "${OBGGCC_TARBALL}"
            tar --directory="$(dirname "${OBGGCC_TARBALL}")" --extract --file="${OBGGCC_TARBALL}"
            
            export OBGGCC_HOME='/tmp/obggcc'
            export PATH="${OBGGCC_HOME}/bin:${PATH}"
            
            source "${OBGGCC_HOME}/build/autotools/${{ matrix.target }}.sh"
            
            gcc-stl-install "${CROSS_COMPILE_TRIPLET}"
        elif [[ '${{ matrix.target }}' = *'-freebsd' ]]; then
            declare -r LOKI_TAG="$(jq --raw-output '.tag_name' <<< "$(curl  --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --url 'https://api.github.com/repos/AmanoTeam/freebsd-gcc-cross/releases/latest')")"
            declare -r LOKI_TARBALL='/tmp/toolchain.tar.xz'
            declare -r LOKI_URL="https://github.com/AmanoTeam/freebsd-gcc-cross/releases/download/${LOKI_TAG}/x86_64-unknown-linux-gnu.tar.xz"
            
            curl --silent --connect-timeout '10' --retry '15' --retry-all-errors --fail --location --url "${LOKI_URL}" --output "${LOKI_TARBALL}"
            tar --directory="$(dirname "${LOKI_TARBALL}")" --extract --file="${LOKI_TARBALL}"
            
            export LOKI_HOME='/tmp/freebsd-gcc-cross'
            export PATH="${LOKI_HOME}/bin:${PATH}"
            
            source "${LOKI_HOME}/build/autotools/${{ matrix.target }}.sh"
        fi
        
        echo "CROSS_COMPILE_TRIPLET=${CROSS_COMPILE_TRIPLET}" >> "${GITHUB_ENV}"
        
        if [[ '${{ matrix.target }}' = *'-android'* ]]; then
            echo "GDB_PACKAGE_NAME=${{ matrix.target }}" >> "${GITHUB_ENV}"
            bash './build-android.sh'
        else
            echo "GDB_PACKAGE_NAME=${CROSS_COMPILE_TRIPLET}" >> "${GITHUB_ENV}"
            bash './build.sh' "${CROSS_COMPILE_TRIPLET}"
        fi
    - name: Create logs
      if: always()
      run: |
        declare logs=''
        
        while read file; do
            logs+="${file} "
        done <<< $(find "/tmp/"*"/build" -wholename '*.log' -o -wholename '*.yaml')
        
        tar --create --file=- ${logs} | xz --threads='0' --compress -9 > '/tmp/logs.tar.xz'
    - name: Upload logs
      if:  always()
      uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.target }}-logs
        if-no-files-found: error
        path: |
            /tmp/logs.tar.xz
    - name: Generate tarball
      run: |
        declare tarball_filename="/tmp/${GDB_PACKAGE_NAME}.tar.xz"
        tar --directory='/tmp' --create --file=- 'gdb' | xz --threads='0' --compress -9 > "${tarball_filename}"
        sha256sum "${tarball_filename}" | sed 's|/tmp/||' > "${tarball_filename}.sha256"
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.GDB_PACKAGE_NAME }}
        if-no-files-found: error
        path: |
          /tmp/${{ env.GDB_PACKAGE_NAME }}.tar.xz
          /tmp/${{ env.GDB_PACKAGE_NAME }}.tar.xz.sha256

  release:
    needs: cross-build
    runs-on: ubuntu-latest
    name: Create release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@main
      - name: Create release
        uses: softprops/action-gh-release@master
        with:
          tag_name: gdb
          name: GNU Debugger
          files: ./*/*.tar.xz*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: "* Release GDB"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

